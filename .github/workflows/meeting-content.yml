name: Transcript draft

on:
  schedule:
    # UTC; retry the same explicitly configured event. Safe-off by default.
    - cron: '20 8 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '会议 UTC 日期 YYYY-MM-DD（connectivity 可留空）'
        type: string
        required: false
      episode:
        description: '期数 1–999（connectivity 可留空）'
        type: string
        required: false
      subject:
        description: '精确会议标题（可用变量或 meeting_id 代替）'
        type: string
        required: false
      meeting_id:
        description: '会议 ID（与标题同时提供时须同时匹配）'
        type: string
        required: false
      mode:
        description: 'validate 本地校验；connectivity 鉴权/schema；fetch-check 远程拉取不公开；draft 公开逐字稿 PR'
        type: choice
        options: [validate, connectivity, fetch-check, draft]
        default: validate

permissions:
  contents: read

# Serialize manual/scheduled attempts; never cancel an in-flight draft.
concurrency:
  group: meeting-content-draft
  cancel-in-progress: false

jobs:
  draft:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'workflow_dispatch' || vars.CONTENT_AUTOMATION_ENABLED == 'true')
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CONTENT_DATE: ${{ github.event_name == 'schedule' && vars.CONTENT_EVENT_DATE || inputs.date }}
      CONTENT_EPISODE: ${{ github.event_name == 'schedule' && vars.CONTENT_EPISODE || inputs.episode }}
      CONTENT_MODE: ${{ inputs.mode || 'draft' }}
      CONTENT_BASE_BRANCH: ${{ github.event.repository.default_branch }}
      CONTENT_MEETING_SUBJECT: ${{ inputs.subject || vars.CONTENT_MEETING_SUBJECT }}
      CONTENT_MEETING_ID: ${{ inputs.meeting_id || vars.CONTENT_MEETING_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Local transcript validation (no secrets)
        if: env.CONTENT_MODE == 'validate'
        run: python3 scripts/meeting_content.py validate
      - name: Tencent connectivity only (no meeting reads)
        if: env.CONTENT_MODE == 'connectivity'
        env:
          TENCENT_MEETING_TOKEN: ${{ secrets.TENCENT_MEETING_TOKEN }}
        run: python3 scripts/meeting_content.py connectivity
      - name: Force remote transcript check (cache only, no public writes)
        if: env.CONTENT_MODE == 'fetch-check'
        env:
          TENCENT_MEETING_TOKEN: ${{ secrets.TENCENT_MEETING_TOKEN }}
        run: python3 scripts/meeting_content.py fetch-check
      - name: Scope and remote idempotency checks
        id: plan
        if: env.CONTENT_MODE == 'draft'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/meeting_content.py prepare
      - name: Read complete remote transcript
        if: steps.plan.outputs.skip == 'false' && env.CONTENT_MODE == 'draft'
        env:
          TENCENT_MEETING_TOKEN: ${{ secrets.TENCENT_MEETING_TOKEN }}
        run: python3 scripts/meeting_content.py fetch
      - name: Write transcript and index only
        if: steps.plan.outputs.skip == 'false' && env.CONTENT_MODE == 'draft'
        run: python3 scripts/meeting_content.py write
      - name: Check content before any commit
        if: steps.plan.outputs.skip == 'false' && env.CONTENT_MODE == 'draft'
        run: python3 scripts/check-content.py
      - name: Create public transcript Draft PR and verify scope (never merge)
        if: steps.plan.outputs.skip == 'false' && env.CONTENT_MODE == 'draft'
        env:
          GH_TOKEN: ${{ github.token }}
          CONTENT_PUBLISH_ALLOWED: 'true'
        run: python3 scripts/meeting_content.py publish
