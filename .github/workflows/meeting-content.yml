name: Transcript download

on:
  workflow_dispatch:
    inputs:
      date:
        description: '会议日期 YYYY-MM-DD；留空自动查找最新一期'
        type: string
        required: false
      timezone:
        description: '会议日期所属时区（默认北京时间）'
        type: choice
        options:
          - Asia/Shanghai
          - America/Los_Angeles
          - UTC
        default: Asia/Shanghai
      episode:
        description: '可选：已核对的期数，如 44；未报期数的会议须同时填 date，不覆盖冲突证据'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: meeting-content-main-write
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CONTENT_DATE: ${{ inputs.date }}
      CONTENT_TIMEZONE: ${{ inputs.timezone || 'Asia/Shanghai' }}
      CONTENT_EPISODE: ${{ inputs.episode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select requested date or latest project occurrence and deduplicate
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TENCENT_MEETING_TOKEN: ${{ secrets.TENCENT_MEETING_TOKEN }}
        shell: bash
        run: |
          if [ -n "$CONTENT_EPISODE" ]; then
            python3 scripts/latest_transcript.py prepare --date "$CONTENT_DATE" --timezone "$CONTENT_TIMEZONE" --episode "$CONTENT_EPISODE"
          elif [ -n "$CONTENT_DATE" ]; then
            python3 scripts/latest_transcript.py prepare --date "$CONTENT_DATE" --timezone "$CONTENT_TIMEZONE"
          else
            python3 scripts/latest_transcript.py prepare
          fi
      - name: Read complete occurrence transcript
        if: steps.plan.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TENCENT_MEETING_TOKEN: ${{ secrets.TENCENT_MEETING_TOKEN }}
        run: python3 scripts/latest_transcript.py fetch
      - name: Write transcript to confirmed episode directory
        if: steps.plan.outputs.skip == 'false'
        run: python3 scripts/latest_transcript.py write
      - name: Check content before commit
        if: steps.plan.outputs.skip == 'false'
        run: python3 scripts/check-content.py
      - name: Commit verified transcript directly to main
        if: steps.plan.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          CONTENT_MAIN_WRITE_ALLOWED: 'true'
        run: python3 scripts/latest_transcript.py publish
      - name: Remove runner-only cache
        if: always()
        run: rm -f .git/latest-plan.json .git/latest-transcript.txt
