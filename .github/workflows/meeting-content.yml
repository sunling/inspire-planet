name: Transcript draft

on:
  workflow_dispatch:
  schedule:
    # 启发星球会议：北京时间周六 08:00–10:00（UTC 周六 00:00–02:00，时长不超过 2 小时）。
    # UTC 周六 02:07 / 02:17 / 02:27 / 03:07，对应北京时间周六
    # 10:07 / 10:17 / 10:27 / 11:07；最后一次为会议延长或转写处理的兜底。
    # 仅自动处理当天（北京时间周六）开始的已结束会议；缺失时安全跳过。
    # 已归档时安全跳过，不会重复拉取或重复开 PR。
    - cron: '7,17,27 2 * * 6'
    - cron: '7 3 * * 6'

permissions:
  contents: read

concurrency:
  group: meeting-content-draft
  cancel-in-progress: false

jobs:
  draft:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'workflow_dispatch' || vars.CONTENT_AUTOMATION_ENABLED == 'true')
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover latest project occurrence and deduplicate before transcript read
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TENCENT_MEETING_TOKEN: ${{ secrets.TENCENT_MEETING_TOKEN }}
        run: python3 scripts/latest_transcript.py prepare
      - name: Read complete occurrence transcript
        if: steps.plan.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TENCENT_MEETING_TOKEN: ${{ secrets.TENCENT_MEETING_TOKEN }}
        run: python3 scripts/latest_transcript.py fetch
      - name: Write transcript with durable identity (pending if EP unknown)
        if: steps.plan.outputs.skip == 'false'
        run: python3 scripts/latest_transcript.py write
      - name: Check content before commit
        if: steps.plan.outputs.skip == 'false'
        run: python3 scripts/check-content.py
      - name: Create and verify public Draft PR (never merge)
        if: steps.plan.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          CONTENT_PUBLISH_ALLOWED: 'true'
        run: python3 scripts/latest_transcript.py publish
      - name: Remove runner-only cache
        if: always()
        run: rm -f .git/latest-plan.json .git/latest-transcript.txt
