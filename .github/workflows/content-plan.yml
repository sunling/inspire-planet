name: Content JSON draft (manual Plan B)

on:
  workflow_dispatch:
    inputs:
      transcript_pr:
        description: '可选：同仓库转写 Draft PR 编号；留空自动选择最新未齐两份 JSON 的已确认期次'
        type: string
        required: false
      target:
        description: '可选：明确年份/EP，例如 2026/EP40；incoming 必须先确认期次'
        type: string
        required: false

permissions:
  contents: read

# Serialize this entry with transcript publishing, without changing its schedule.
concurrency:
  group: meeting-content-draft
  cancel-in-progress: false

jobs:
  draft:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.default_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      CONTENT_LLM_BASE_URL: ${{ vars.CONTENT_LLM_BASE_URL }}
      CONTENT_LLM_MODEL: ${{ vars.CONTENT_LLM_MODEL }}
    steps:
      - name: Configuration gate before checkout or transcript downloads
        env:
          CONTENT_LLM_KEY_PRESENT: ${{ secrets.CONTENT_LLM_API_KEY != '' }}
        run: |
          if [ -z "${CONTENT_LLM_BASE_URL//[[:space:]]/}" ] ||
             [ -z "${CONTENT_LLM_MODEL//[[:space:]]/}" ] ||
             [ "$CONTENT_LLM_KEY_PRESENT" != 'true' ]; then
            printf '%s\n' '::error::Plan B 未启用：请在合并后设置 Variables CONTENT_LLM_BASE_URL、CONTENT_LLM_MODEL 与 Secret CONTENT_LLM_API_KEY；自带 AI 工具无需项目 API。'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight before transcript download, model billing or writes
        env:
          CONTENT_LLM_KEY_PRESENT: ${{ secrets.CONTENT_LLM_API_KEY != '' }}
        run: python3 scripts/content_plan.py preflight
      - name: Prepare pinned DATA only and deduplicate before billing
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CONTENT_LLM_KEY_PRESENT: ${{ secrets.CONTENT_LLM_API_KEY != '' }}
          CONTENT_TRANSCRIPT_PR: ${{ inputs.transcript_pr }}
          CONTENT_TARGET: ${{ inputs.target }}
        run: python3 scripts/content_plan.py prepare
      - name: Generate missing JSON (one paid request, no GitHub credentials)
        if: steps.plan.outputs.skip == 'false'
        env:
          CONTENT_LLM_API_KEY: ${{ secrets.CONTENT_LLM_API_KEY }}
        run: python3 scripts/content_plan.py generate
      - name: Check and publish scoped Draft PR, verify remote result
        if: steps.plan.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          CONTENT_PUBLISH_ALLOWED: 'true'
        run: python3 scripts/content_plan.py publish
      - name: Remove runner-only data (no log or artifact uploads)
        if: always()
        run: rm -f .git/content-plan.json .git/content-response.json
