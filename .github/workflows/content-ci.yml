name: Content CI

on:
  push:
    branches: [main, 'feat/**', 'content/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ep40-readonly:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: EP40 real readonly fetch-check (explicit dispatch)
        env:
          TENCENT_MEETING_TOKEN: ${{ secrets.TENCENT_MEETING_TOKEN }}
          CONTENT_DATE: '2026-10-10'
          CONTENT_EPISODE: '40'
          CONTENT_MEETING_ID: '13319006708380765410'
        run: python3 scripts/meeting_content.py fetch-check
      - name: Verify public files unchanged
        run: test -z "$(git status --porcelain)"
      - name: Remove runner-only transcript cache
        if: always()
        run: rm -f .git/meeting-content-fetch-check.txt
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test transcript automation (synthetic fixtures)
        run: python3 -m unittest discover -s scripts -p 'test_meeting_content.py' -v
      - name: Check repository content
        run: python3 scripts/check-content.py
