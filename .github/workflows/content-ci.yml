name: Content CI

on:
  push:
    branches: [main, 'feat/**', 'content/**']
  pull_request:
  workflow_dispatch:
    inputs:
      check_date:
        description: '只读实测日期（北京时间 YYYY-MM-DD）；已归档也重新读取，不提交'
        type: string
        default: '2026-10-10'
        required: true

permissions:
  contents: read

jobs:
  ep40-readonly:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Selected meeting real readonly fetch-check (explicit dispatch)
        env:
          TENCENT_MEETING_TOKEN: ${{ secrets.TENCENT_MEETING_TOKEN }}
          CONTENT_DATE: ${{ inputs.check_date || '2026-10-10' }}
        run: python3 scripts/latest_transcript.py fetch-check --date "$CONTENT_DATE"
      - name: Compare fetched transcript with archived copy
        env:
          CONTENT_DATE: ${{ inputs.check_date || '2026-10-10' }}
        run: |
          python3 - <<'PYTHON'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import meeting_content as m
          day = os.environ['CONTENT_DATE']
          files = list(Path('events').glob(f"{day[:4]}/{day.replace('-', '')}-ep*/transcript.txt"))
          if len(files) != 1:
              print('完整下载已验证；本地无唯一日期归档，跳过比对。')
          else:
              remote = m.parse_transcript(Path('.git/meeting-content-fetch-check.txt').read_text())
              try:
                  local = m.parse_transcript(files[0].read_text())
              except m.SafeError:
                  print('远程完整转写已验证；本地归档不是标准原始转写格式，跳过逐段比对，未覆盖归档。')
                  sys.exit(0)
              def canonical(blocks):
                  return [(b['speaker'].strip(), b['time'], ''.join(b['text'].split())) for b in blocks]
              same = canonical(remote) == canonical(local)
              print(f'远程段落={len(remote)}；归档段落={len(local)}；忽略空白后内容一致={same}')
              if not same:
                  print('下载成功，但与归档内容存在差异；需另行核对，未覆盖归档。')
          PYTHON
      - name: Verify public files unchanged
        run: test -z "$(git status --porcelain)"
      - name: Remove runner-only transcript cache
        if: always()
        run: rm -f .git/meeting-content-fetch-check.txt
  history-scan-readonly:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real bounded read-only history scan (explicit dispatch only)
        env:
          GH_TOKEN: ${{ github.token }}
          TENCENT_MEETING_TOKEN: ${{ secrets.TENCENT_MEETING_TOKEN }}
        run: python3 scripts/latest_transcript.py scan
      - name: Verify public files unchanged
        run: test -z "$(git status --porcelain)"
  latest-readonly:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real zero-input project discovery (explicit dispatch only)
        env:
          GH_TOKEN: ${{ github.token }}
          TENCENT_MEETING_TOKEN: ${{ secrets.TENCENT_MEETING_TOKEN }}
        run: python3 scripts/latest_transcript.py readonly
      - name: Verify public files unchanged
        run: test -z "$(git status --porcelain)"
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test transcript automation (synthetic fixtures)
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check repository content
        run: python3 scripts/check-content.py
