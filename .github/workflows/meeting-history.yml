name: 历史会议转写 · 查找与补录

on:
  workflow_dispatch:
    inputs:
      operation:
        description: '要做什么？先查找历史会议，或按指定日期补录'
        type: choice
        options:
          - 查找未归档会议
          - 按日期补录
        default: 查找未归档会议
      date:
        description: '按日期补录时填写：YYYY-MM-DD（如 2026-09-26）'
        type: string
        required: false
      timezone:
        description: '会议日期使用哪个时区？默认北京时间'
        type: choice
        options:
          - Asia/Shanghai
          - America/Los_Angeles
          - UTC
        default: Asia/Shanghai

permissions:
  contents: read

# Share the production lock with zero-input latest discovery.
concurrency:
  group: meeting-content-draft
  cancel-in-progress: false

jobs:
  draft:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CONTENT_DATE: ${{ inputs.date }}
      CONTENT_TIMEZONE: ${{ inputs.timezone }}
      CONTENT_OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate selected operation
        shell: bash
        run: |
          if [ "$CONTENT_OPERATION" = "查找未归档会议" ]; then
            if [ -n "$CONTENT_DATE" ]; then
              echo "::error::查找无需填日期；请选择按日期补录"
              exit 1
            fi
          elif [ "$CONTENT_OPERATION" = "按日期补录" ]; then
            if [[ ! "$CONTENT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::请填写 YYYY-MM-DD 格式的会议日期"
              exit 1
            fi
          else
            exit 1
          fi
      - name: Find unarchived historical meetings (read-only)
        if: env.CONTENT_OPERATION == '查找未归档会议'
        env:
          GH_TOKEN: ${{ github.token }}
          TENCENT_MEETING_TOKEN: ${{ secrets.TENCENT_MEETING_TOKEN }}
        run: python3 scripts/latest_transcript.py scan
      - name: Match selected date and create draft plan
        id: plan
        if: env.CONTENT_OPERATION == '按日期补录'
        env:
          GH_TOKEN: ${{ github.token }}
          TENCENT_MEETING_TOKEN: ${{ secrets.TENCENT_MEETING_TOKEN }}
        run: python3 scripts/latest_transcript.py prepare --date "$CONTENT_DATE" --timezone "$CONTENT_TIMEZONE"
      - name: Read complete remote transcript
        if: steps.plan.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TENCENT_MEETING_TOKEN: ${{ secrets.TENCENT_MEETING_TOKEN }}
        run: python3 scripts/latest_transcript.py fetch
      - name: Write scoped transcript and instance metadata
        if: steps.plan.outputs.skip == 'false'
        run: python3 scripts/latest_transcript.py write
      - name: Check content before any commit
        if: steps.plan.outputs.skip == 'false'
        run: python3 scripts/check-content.py
      - name: Create public transcript Draft PR and verify scope (never merge)
        if: steps.plan.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          CONTENT_PUBLISH_ALLOWED: 'true'
        run: python3 scripts/latest_transcript.py publish
      - name: Verify checks and scans did not change public files
        if: >-
          env.CONTENT_OPERATION == '查找未归档会议'
        run: test -z "$(git status --porcelain)"
      - name: Remove runner-only plans and transcript caches
        if: always()
        run: rm -f .git/latest-plan.json .git/latest-transcript.txt .git/meeting-content-fetch-check.txt
