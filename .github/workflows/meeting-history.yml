name: 历史会议转写 · 查找与补录

on:
  workflow_dispatch:
    inputs:
      date:
        description: '直接按日期补录：填 YYYY-MM-DD（如 2026-09-26）；与 pick 二选一'
        type: string
        required: false
      pick:
        description: '按编号补录：先将 date/pick 留空运行，查看日志编号，再填数字（如 3）'
        type: string
        required: false
      mode:
        description: '一般保持 draft：空日期和编号=查找；填日期或编号=创建草稿。其余为维护检查'
        type: choice
        options: [draft, fetch-check, connectivity]
        default: draft

permissions:
  contents: read

# Share the production lock with zero-input latest discovery.
concurrency:
  group: meeting-content-draft
  cancel-in-progress: false

jobs:
  draft:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CONTENT_DATE: ${{ inputs.date }}
      CONTENT_PICK: ${{ inputs.pick }}
      CONTENT_MODE: ${{ inputs.mode || 'draft' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tencent connectivity only (no meeting reads)
        if: env.CONTENT_MODE == 'connectivity'
        env:
          TENCENT_MEETING_TOKEN: ${{ secrets.TENCENT_MEETING_TOKEN }}
        run: python3 scripts/meeting_content.py connectivity
      - name: Bounded read-only scan when no date or pick is given
        if: env.CONTENT_MODE == 'draft' && env.CONTENT_DATE == '' && env.CONTENT_PICK == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TENCENT_MEETING_TOKEN: ${{ secrets.TENCENT_MEETING_TOKEN }}
        run: python3 scripts/latest_transcript.py scan
      - name: Force remote transcript check (cache only, no public writes)
        if: env.CONTENT_MODE == 'fetch-check'
        env:
          TENCENT_MEETING_TOKEN: ${{ secrets.TENCENT_MEETING_TOKEN }}
        run: python3 scripts/latest_transcript.py fetch-check --date "$CONTENT_DATE"
      - name: Resolve historical occurrence by local date or scan number and check archives
        id: plan
        if: env.CONTENT_MODE == 'draft' && (env.CONTENT_DATE != '' || env.CONTENT_PICK != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TENCENT_MEETING_TOKEN: ${{ secrets.TENCENT_MEETING_TOKEN }}
        run: python3 scripts/latest_transcript.py prepare --pick "$CONTENT_PICK" --date "$CONTENT_DATE"
      - name: Read complete remote transcript
        if: steps.plan.outputs.skip == 'false' && env.CONTENT_MODE == 'draft'
        env:
          GH_TOKEN: ${{ github.token }}
          TENCENT_MEETING_TOKEN: ${{ secrets.TENCENT_MEETING_TOKEN }}
        run: python3 scripts/latest_transcript.py fetch
      - name: Write scoped transcript and instance metadata
        if: steps.plan.outputs.skip == 'false' && env.CONTENT_MODE == 'draft'
        run: python3 scripts/latest_transcript.py write
      - name: Check content before any commit
        if: steps.plan.outputs.skip == 'false' && env.CONTENT_MODE == 'draft'
        run: python3 scripts/check-content.py
      - name: Create public transcript Draft PR and verify scope (never merge)
        if: steps.plan.outputs.skip == 'false' && env.CONTENT_MODE == 'draft'
        env:
          GH_TOKEN: ${{ github.token }}
          CONTENT_PUBLISH_ALLOWED: 'true'
        run: python3 scripts/latest_transcript.py publish
      - name: Verify checks and scans did not change public files
        if: >-
          env.CONTENT_MODE != 'draft' ||
          (env.CONTENT_DATE == '' && env.CONTENT_PICK == '')
        run: test -z "$(git status --porcelain)"
      - name: Remove runner-only plans and transcript caches
        if: always()
        run: rm -f .git/latest-plan.json .git/latest-transcript.txt .git/meeting-content-fetch-check.txt
