name: Render content (temporary download)

on:
  workflow_dispatch:
    inputs:
      episode:
        description: 'Event folder name, e.g. 20260919-ep37'
        required: true
        type: string
      channel:
        description: 'Content channel'
        required: true
        default: xhs
        type: choice
        options:
          - xhs
          - sph
          - all

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Validate input
        shell: bash
        env:
          EPISODE: ${{ inputs.episode }}
        run: |
          if [[ ! "$EPISODE" =~ ^20[0-9]{6}-ep[0-9]{1,3}$ ]]; then
            echo "::error::Invalid event folder name"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/text-cards/requirements.txt
      - name: Install renderer
        run: |
          python -m pip install -r scripts/text-cards/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check content schema
        run: python scripts/check-content.py
      - name: Render into temporary runner storage
        shell: bash
        env:
          EPISODE: ${{ inputs.episode }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          event="events/2026/$EPISODE"
          test -d "$event" || { echo "::error::Event not found"; exit 1; }
          args=()
          if [ "$CHANNEL" = all ]; then
            for channel in xhs sph; do
              if compgen -G "$event/${channel}-*.md" > /dev/null; then
                args+=(--channel "$channel")
              fi
            done
          else
            args+=(--channel "$CHANNEL")
          fi
          test "${#args[@]}" -gt 0 || { echo "::error::No renderable content"; exit 1; }
          python scripts/render-publish.py "$event" \
            --root "$RUNNER_TEMP/inspire-planet-publish" \
            "${args[@]}"
          # upload-artifact already creates a downloadable ZIP. Include just
          # the JPEG directory and its HTML preview; omit nested channel/all ZIPs.
          mkdir -p "$RUNNER_TEMP/deliverable"
          cp -a "$RUNNER_TEMP/inspire-planet-publish/$EPISODE/ready" "$RUNNER_TEMP/deliverable/"
          cp "$RUNNER_TEMP/inspire-planet-publish/$EPISODE/preview.html" "$RUNNER_TEMP/deliverable/"
      - uses: actions/upload-artifact@v4
        with:
          name: render-${{ inputs.episode }}-${{ inputs.channel }}-${{ github.run_number }}
          path: ${{ runner.temp }}/deliverable/
          if-no-files-found: error
          retention-days: 1

